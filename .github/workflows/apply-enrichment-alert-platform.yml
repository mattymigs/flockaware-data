name: Apply enrichment and alert-feed platform

on:
  push:
    branches:
      - feature/osm-enrichment-alert-feed
    paths:
      - ".github/workflows/apply-enrichment-alert-platform.yml"
      - "pipeline/apply_enrichment_integration.py"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/osm-enrichment-alert-feed
          fetch-depth: 0

      - name: Apply integration patch
        run: python3 pipeline/apply_enrichment_integration.py

      - name: Validate source and unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/refresh_osm_enrichment.mjs
          PYTHONPATH=pipeline python3 -m unittest pipeline/test_enrichment.py
          python3 pipeline/validate_us_publication.py

      - name: Commit integration and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-enrichment-alert-platform.yml
          rm -f pipeline/apply_enrichment_integration.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Merge OSM enrichment and publish new-camera alert feed"
          git pull --rebase origin feature/osm-enrichment-alert-feed
          git push origin HEAD:feature/osm-enrichment-alert-feed
