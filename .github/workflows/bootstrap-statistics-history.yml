name: Bootstrap shared statistics history

on:
  push:
    branches:
      - feature/shared-statistics-history
    paths:
      - ".github/workflows/bootstrap-statistics-history.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record current publication
        run: node scripts/record_stats_history.mjs

      - name: Commit first history snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add statistics/history.json
          if git diff --cached --quiet; then
            echo "Statistics history is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bootstrap shared camera statistics history"
          git push origin HEAD:feature/shared-statistics-history
