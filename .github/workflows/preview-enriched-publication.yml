name: Build enriched camera publication preview

on:
  push:
    branches:
      - feature/osm-enrichment-alert-feed
    paths:
      - ".github/workflows/preview-enriched-publication.yml"
      - "scripts/fix_existing_detail_levels.py"

permissions:
  contents: write

concurrency:
  group: preview-flockaware-enriched-publication
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/osm-enrichment-alert-feed
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply existing-rich-record detail labels
        run: python scripts/fix_existing_detail_levels.py

      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check -r pipeline/requirements.txt

      - name: Refresh priority direct-OSM enrichment
        run: node scripts/refresh_osm_enrichment.mjs --states=PA,NY,CT,DE,MD,VA,MA,RI

      - name: Build merged publication and new-camera feed
        run: python pipeline/build_us_states.py

      - name: Validate full publication
        run: python pipeline/validate_us_publication.py

      - name: Commit validated preview and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/preview-enriched-publication.yml
          rm -f scripts/fix_existing_detail_levels.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish enriched Northeast camera preview"
          git pull --rebase origin feature/osm-enrichment-alert-feed
          git push origin HEAD:feature/osm-enrichment-alert-feed
