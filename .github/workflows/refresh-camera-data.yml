name: Refresh national camera coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "pipeline/**"
      - "enrichment/**"
      - ".github/workflows/refresh-camera-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-flockaware-camera-publication
  cancel-in-progress: false

jobs:
  refresh-united-states:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install geospatial pipeline dependencies
        run: python -m pip install --disable-pip-version-check -r pipeline/requirements.txt

      - name: Refresh broad coverage and merge available OSM enrichment
        run: python pipeline/build_us_states.py

      - name: Validate state files, change feeds, and new-camera feed
        run: python pipeline/validate_us_publication.py

      - name: Commit validated publication
        shell: bash
        run: |
          set -euo pipefail

          git add us_state_manifest.json states changes alerts
          if git diff --cached --quiet; then
            echo "No validated camera changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish refreshed national camera data"
          git pull --rebase origin main
          git push origin HEAD:main
