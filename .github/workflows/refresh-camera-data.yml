name: Refresh national camera coverage backbone

on:
  workflow_dispatch:
  schedule:
    # The compact national index is our coverage backbone. Twice weekly is
    # sufficient; richer metadata is handled separately in smaller OSM batches.
    - cron: "17 11 * * 2,5"
  push:
    branches:
      - main
    paths:
      - "pipeline/**"
      - ".github/workflows/refresh-camera-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-flockaware-national-camera-data
  cancel-in-progress: false

jobs:
  refresh-united-states:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install geospatial pipeline dependencies
        run: python -m pip install --disable-pip-version-check -r pipeline/requirements.txt

      - name: Build 50-state and DC camera publication
        run: python pipeline/build_us_states.py

      - name: Independently validate complete publication
        run: python pipeline/validate_us_publication.py

      - name: Record national and state statistics
        run: node scripts/record_stats_history.mjs

      - name: Commit validated publication
        shell: bash
        run: |
          set -euo pipefail

          git add us_state_manifest.json states changes statistics
          if git diff --cached --quiet; then
            echo "No validated camera or statistics changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish refreshed national camera coverage"

          git pull --rebase origin main
          git push origin HEAD:main
