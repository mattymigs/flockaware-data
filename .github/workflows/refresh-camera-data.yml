name: Refresh national camera data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/refresh_us.py"
      - "scripts/validate_us.py"
      - ".github/workflows/refresh-camera-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-flockaware-national-camera-data
  cancel-in-progress: false

jobs:
  refresh-united-states:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install geospatial pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "shapely>=2,<3" "pyshp>=2.3,<3"

      - name: Build 50-state and DC camera publication
        run: python scripts/refresh_us.py

      - name: Independently validate complete publication
        run: python scripts/validate_us.py

      - name: Commit validated publication
        shell: bash
        run: |
          set -euo pipefail

          git add us_state_manifest.json states changes
          if git diff --cached --quiet; then
            echo "No validated camera changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish national camera data"

          git pull --rebase origin main
          git push origin HEAD:main
