name: Refresh OSM camera metadata enrichment

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated state codes; use ALL for all 50 states plus DC"
        required: false
        default: "NJ,NY,PA,CT,DE,MD,VA,MA,RI"
  schedule:
    - cron: "23 08 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/refresh_osm_enrichment.mjs"
      - "pipeline/enrichment.py"
      - "pipeline/test_enrichment.py"
      - "pipeline/build_us_states.py"
      - "pipeline/validate_us_publication.py"
      - ".github/workflows/refresh-us-camera-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-flockaware-camera-publication
  cancel-in-progress: false

jobs:
  enrich-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install geospatial pipeline dependencies
        run: python -m pip install --disable-pip-version-check -r pipeline/requirements.txt

      - name: Refresh direct OSM metadata overlays
        shell: bash
        env:
          REQUESTED_STATES: ${{ github.event.inputs.states || 'NJ,NY,PA,CT,DE,MD,VA,MA,RI' }}
        run: |
          set -euo pipefail
          if [[ "${REQUESTED_STATES^^}" == "ALL" ]]; then
            node scripts/refresh_osm_enrichment.mjs --all
          else
            node scripts/refresh_osm_enrichment.mjs --states="${REQUESTED_STATES}"
          fi

      - name: Merge broad coverage with available enrichment
        run: python pipeline/build_us_states.py

      - name: Validate complete publication and alert feed
        run: python pipeline/validate_us_publication.py

      - name: Commit validated enrichment publication
        shell: bash
        run: |
          set -euo pipefail

          git add enrichment us_state_manifest.json states changes alerts
          if git diff --cached --quiet; then
            echo "No validated enrichment or camera changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish enriched national camera data"
          git pull --rebase origin main
          git push origin HEAD:main
