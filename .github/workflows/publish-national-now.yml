name: Publish definitive national camera data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-national-now.yml"

permissions:
  contents: write

concurrency:
  group: definitive-national-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check -r pipeline/requirements.txt

      - name: Build state packs
        run: python pipeline/build_us_states.py

      - name: Validate all 50 states and DC
        run: python pipeline/validate_us_publication.py

      - name: Commit publication and retire one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-national-now.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            git commit --allow-empty -m "Validate 50-state camera publication"
          else
            git commit -m "Publish 50-state and DC camera datasets"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
